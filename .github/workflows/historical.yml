name: Historical reproduction

on:
  pull_request:
    paths:
      - '.github/workflows/historical.yml'
      - 'experiments/assembly/**'
      - 'Luminary099/**'
      - 'scripts/**'
      - 'tools/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical.yml'
      - 'experiments/assembly/**'
      - 'Luminary099/**'
      - 'scripts/**'
      - 'tools/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luminary:
    name: Luminary 099 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build pinned Virtual AGC tools
        run: python scripts/virtualagc.py --cc cc
      - name: Verify Luminary against the proofed rope
        run: python scripts/reproduce_luminary.py
      - name: Verify the normalized archive against the proofed rope
        run: |
          python scripts/reproduce_luminary.py --source archive-normalized --output build/luminary099-archive-normalized
      - name: Check fixed-bank analysis
        run: |
          python -m pip install -e .
          apollo-agc memory build/luminary099/assembly.lst --format json > build/luminary099/memory.json
      - name: Run the headless boot check
        run: python scripts/emulator_smoke.py --cc cc build/luminary099/Luminary099.bin
      - name: Compare isolated assembly experiments
        run: python scripts/run_optimizations.py --cc cc
      - name: Compare each WAITLIST path in the rebuilt rope
        run: python scripts/waitlist_overlay.py --cc cc
      - name: Upload assembly experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agc-experiment-results
          path: |
            build/optimizations/run-*/*/comparison.json
            build/waitlist-experiment/run-*/overlay.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luminary099-verification
          path: |
            build/luminary099/verification.json
            build/luminary099/assembly.log
            build/luminary099/oct2bin.log
            build/luminary099/memory.json
            build/luminary099-archive-normalized/verification.json
            build/luminary099-archive-normalized/assembly.log
            build/emulator/smoke.json
