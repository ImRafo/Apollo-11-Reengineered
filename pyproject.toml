[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-11-reengineered"
version = "0.1.0.dev0"
description = "Source and build research tools for the Apollo Guidance Computer Block II"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
apollo-agc = "apollo_agc.cli:main"

[project.urls]
Repository = "https://github.com/ImRafo/Apollo-11-Reengineered"

[tool.setuptools.packages.find]
where = ["tools"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
